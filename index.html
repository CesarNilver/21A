<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Amarillas - Edel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: grab;
        }

        body:active {
            cursor: grabbing;
        }

        #universe {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Indicador visual de control */
        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 235, 150, 0.9);
            font-size: 13px;
            pointer-events: none;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.9);
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            z-index: 10;
        }

        /* Modal romántico */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(8px);
            transition: opacity 0.5s ease;
        }

        .modal-card {
            background: linear-gradient(145deg, rgba(30, 18, 5, 0.95), rgba(10, 5, 15, 0.98));
            border: 2px solid #ffaa00;
            box-shadow: 0 0 35px rgba(255, 170, 0, 0.6);
            border-radius: 24px;
            padding: 35px;
            max-width: 440px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 42px;
            color: #ffc233;
            margin-bottom: 18px;
            text-shadow: 0 0 12px rgba(255, 194, 51, 0.6);
        }

        .modal-text {
            font-size: 15px;
            line-height: 1.6;
            color: #ebdcd0;
            margin-bottom: 15px;
            font-style: italic;
        }

        .modal-btn {
            background: linear-gradient(135deg, #ff9900, #b35900);
            color: white;
            border: none;
            padding: 11px 32px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 12px rgba(255, 153, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 180, 0, 0.8);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="universe">
        <canvas id="galaxyCanvas"></canvas>
        <div class="hint">✨ Arrastra para girar la galaxia 3D de Edel ✨</div>
    </div>

    <!-- Modal emergente -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal-card">
            <h1 class="modal-title">Mi Amor...</h1>
            <p class="modal-text">Eres la coincidencia más hermosa que me pudo pasar.</p>
            <p class="modal-text">Así como estas flores y estrellas iluminan la inmensidad, tu sonrisa ilumina cada uno de mis días.</p>
            <p class="modal-text"><strong>¡Feliz Día de las Flores Amarillas, Mi Amor!</strong><br>Te amo infinitamente, Edel.</p>
            <button class="modal-btn" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // --- Controles de Interacción 3D ---
        let rotX = 0.5;
        let rotY = 0;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            rotY += deltaX * 0.004;
            rotX += deltaY * 0.004;
            rotX = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, rotX));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => isDragging = false);

        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            rotY += deltaX * 0.004;
            rotX += deltaY * 0.004;
            rotX = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, rotX));

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchend', () => isDragging = false);

        // --- Generación de Partículas (Estrellas + Puntitos Amarillos) ---
        const GALAXY_PARTICLES = 6500;
        const galaxy = [];

        for (let i = 0; i < GALAXY_PARTICLES; i++) {
            const isNucleus = i < 700;
            let dist, angle, color, size, speed;

            if (isNucleus) {
                dist = Math.pow(Math.random(), 1.5) * 65;
                angle = Math.random() * Math.PI * 2;
                color = `rgba(255, ${220 + Math.floor(Math.random() * 35)}, ${Math.floor(Math.random() * 80)}, ${0.85 + Math.random() * 0.15})`;
                size = 1.2 + Math.random() * 2.8;
                speed = 0.0025 + Math.random() * 0.001;
            } else {
                angle = Math.random() * Math.PI * 4;
                dist = 50 + Math.pow(Math.random(), 1.3) * (Math.min(width, height) * 0.52);

                const isGoldYellow = Math.random() < 0.75;
                if (isGoldYellow) {
                    const r = 255;
                    const g = Math.floor(180 + Math.random() * 75);
                    const b = Math.floor(Math.random() * 50);
                    color = `rgba(${r}, ${g}, ${b}, ${0.4 + Math.random() * 0.55})`;
                    size = 0.9 + Math.random() * 2.2;
                } else {
                    const r = Math.floor(180 + Math.random() * 75);
                    const g = Math.floor(50 + Math.random() * 100);
                    const b = 255;
                    color = `rgba(${r}, ${g}, ${b}, ${0.3 + Math.random() * 0.5})`;
                    size = 0.7 + Math.random() * 1.5;
                }
                speed = 0.0008 + (120 / (dist + 60)) * 0.0006;
            }

            galaxy.push({
                dist: dist,
                angle: angle,
                speed: speed,
                color: color,
                size: size,
                twinkle: Math.random() * Math.PI * 2
            });
        }

        // --- Lista de Palabras Exactas ---
        const words = [
            "Mi sol", "Mi amor", "Mi destino", "Mi cielo", "Esperanza", 
            "Libertad", "Felicidad", "Pasión", "Reina", "Mi razón", 
            "Eternidad", "Brillas", "Sueños", "Mi flor", "Contigo", 
            "Mi calma", "Mi universo", "Dulzura", "Ternura", "Mi fiesta"
        ];

        // Posiciones orbitales para las etiquetas
        const totalItems = words.length;
        const floatingItems = words.map((word, index) => {
            const angle = (index / totalItems) * Math.PI * 2 + Math.random() * 0.2;
            const dist = 140 + Math.random() * (Math.min(width, height) * 0.32);
            return {
                word: word,
                dist: dist,
                angle: angle,
                radius: 18 + Math.random() * 6,
                isHighlight: index % 3 === 0
            };
        });

        // --- Función para Dibujar Girasoles Realistas ---
        function drawRealisticSunflower(x, y, radius) {
            ctx.save();
            ctx.translate(x, y);

            // Capas de pétalos
            const petalLayers = [
                { count: 16, lenRatio: 1.2, widthRatio: 0.32, color: '#D97706' }, // Pétalos traseros oscuros
                { count: 18, lenRatio: 1.0, widthRatio: 0.30, color: '#FBBF24' }, // Capa media brillante
                { count: 14, lenRatio: 0.8, widthRatio: 0.28, color: '#FEF08A' }  // Capa interna clara
            ];

            petalLayers.forEach((layer, layerIdx) => {
                const offset = (layerIdx * Math.PI) / layer.count;
                for (let i = 0; i < layer.count; i++) {
                    const angle = (i * Math.PI * 2) / layer.count + offset;
                    ctx.save();
                    ctx.rotate(angle);

                    ctx.beginPath();
                    const pLen = radius * layer.lenRatio;
                    const pWidth = radius * layer.widthRatio;

                    ctx.moveTo(0, -radius * 0.3);
                    ctx.bezierCurveTo(-pWidth, -radius * 0.6, -pWidth * 0.8, -pLen, 0, -pLen * 1.1);
                    ctx.bezierCurveTo(pWidth * 0.8, -pLen, pWidth, -radius * 0.6, 0, -radius * 0.3);

                    ctx.fillStyle = layer.color;
                    ctx.shadowColor = '#D97706';
                    ctx.shadowBlur = 4;
                    ctx.fill();
                    ctx.restore();
                }
            });

            // Centro oscuro en espiral de semillas
            const centerRadius = radius * 0.42;
            ctx.beginPath();
            ctx.arc(0, 0, centerRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#2A1508';
            ctx.shadowColor = '#000000';
            ctx.shadowBlur = 6;
            ctx.fill();

            const seedCount = 40;
            const goldenAngle = 137.5 * (Math.PI / 180);
            for (let i = 0; i < seedCount; i++) {
                const r = Math.sqrt(i / seedCount) * (centerRadius * 0.85);
                const theta = i * goldenAngle;
                const sX = r * Math.cos(theta);
                const sY = r * Math.sin(theta);

                ctx.beginPath();
                ctx.arc(sX, sY, radius * 0.038, 0, Math.PI * 2);
                ctx.fillStyle = i % 2 === 0 ? '#5C3317' : '#8B4513';
                ctx.fill();
            }

            ctx.restore();
        }

        // --- Bucle de Animación ---
        let pulseTime = 0;

        function animate() {
            ctx.fillStyle = '#020208';
            ctx.fillRect(0, 0, width, height);

            pulseTime += 0.03;

            // 1. Dibujar Partículas de la Galaxia
            galaxy.forEach(p => {
                p.angle += p.speed;
                p.twinkle += 0.05;

                const rawX = Math.cos(p.angle + rotY) * p.dist;
                const rawY = Math.sin(p.angle + rotY) * p.dist;

                const screenX = centerX + rawX;
                const screenY = centerY + rawY * Math.sin(rotX);

                const twinkleAlpha = 0.7 + Math.sin(p.twinkle) * 0.3;

                ctx.beginPath();
                ctx.arc(screenX, screenY, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = twinkleAlpha;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            // 2. Núcleo Resplandeciente
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 85);
            gradient.addColorStop(0, 'rgba(255, 255, 240, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 215, 0, 0.9)');
            gradient.addColorStop(0.55, 'rgba(255, 140, 0, 0.4)');
            gradient.addColorStop(1, 'transparent');

            ctx.beginPath();
            ctx.arc(centerX, centerY, 85, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // 3. Dibujar Girasoles con sus Etiquetas
            floatingItems.forEach(f => {
                const floatY = Math.sin(pulseTime + f.dist) * 6;

                const currentAngle = f.angle + rotY;
                const rawX = Math.cos(currentAngle) * f.dist;
                const rawY = Math.sin(currentAngle) * f.dist;

                const screenX = centerX + rawX;
                const screenY = centerY + rawY * Math.sin(rotX) + floatY;

                // Dibujar girasol
                drawRealisticSunflower(screenX - 35, screenY, f.radius);

                // Dibujar etiqueta de texto
                ctx.save();
                ctx.font = f.isHighlight ? "bold 15px 'Segoe UI', sans-serif" : "bold 13px 'Segoe UI', sans-serif";

                const textWidth = ctx.measureText(f.word).width;
                const paddingX = 14;
                const paddingY = 6;
                const rectX = screenX;
                const rectY = screenY - 12;
                const rectWidth = textWidth + paddingX * 2;
                const rectHeight = 24;

                // Fondo de la etiqueta
                ctx.beginPath();
                ctx.roundRect(rectX, rectY, rectWidth, rectHeight, 12);
                ctx.fillStyle = 'rgba(10, 8, 5, 0.88)';
                ctx.fill();

                // Borde dorado
                ctx.strokeStyle = f.isHighlight ? '#ffee77' : '#ffcc00';
                ctx.lineWidth = f.isHighlight ? 2 : 1.5;
                ctx.shadowColor = '#ffcc00';
                ctx.shadowBlur = f.isHighlight ? 12 : 6;
                ctx.stroke();

                // Texto
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 4;
                ctx.fillText(f.word, rectX + paddingX, rectY + 16);

                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // --- Cerrar Modal ---
        function closeModal() {
            const modal = document.getElementById('cardModal');
            modal.style.opacity = '0';
            setTimeout(() => modal.classList.add('hidden'), 500);
        }
    </script>
</body>
</html>
