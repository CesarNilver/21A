<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Galaxia 3D de Flores Amarillas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020105;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
            overflow: hidden;
            touch-action: none;
        }

        #viewport:active {
            cursor: grabbing;
        }

        #space-container {
            position: absolute;
            width: 300vw;
            height: 300vh;
            top: -100vh;
            left: -100vw;
            will-change: transform;
            touch-action: none;
            transform-origin: center center;
        }

        #galaxyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Elementos flotantes en órbita 3D */
        .floating-item {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            z-index: 15;
            will-change: transform;
        }

        .sunflower-svg {
            width: 58px;
            height: 58px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.9));
        }

        .tag-text {
            background: rgba(15, 5, 20, 0.75);
            padding: 6px 16px;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff00a0;
            border: 1px solid rgba(255, 0, 150, 0.6);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 18px rgba(255, 0, 128, 0.3);
        }

        .tag-text.highlight {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 15px #ffffff, 0 0 30px #ff007f;
            background: rgba(40, 5, 30, 0.85);
        }

        /* Modal romántico */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .modal-card {
            background: linear-gradient(145deg, rgba(35, 8, 25, 0.95), rgba(12, 3, 15, 0.98));
            border: 2px solid #ff007f;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.6), 0 0 15px rgba(255, 215, 0, 0.4);
            border-radius: 24px;
            padding: 35px;
            max-width: 440px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 44px;
            color: #ffcc00;
            margin-bottom: 18px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }

        .modal-text {
            font-size: 15px;
            line-height: 1.6;
            color: #fce4ec;
            margin-bottom: 15px;
            font-style: italic;
        }

        .modal-btn {
            background: linear-gradient(135deg, #ff007f, #99004c);
            color: white;
            border: none;
            padding: 12px 34px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 22px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
            transition: transform 0.2s, background 0.2s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ff3399, #cc0066);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="space-container">
            <canvas id="galaxyCanvas"></canvas>
        </div>
    </div>

    <!-- Modal con mensaje final -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal-card">
            <h1 class="modal-title">Mi Amor...</h1>
            <p class="modal-text">Eres la coincidencia más hermosa que me pudo pasar.</p>
            <p class="modal-text">Así como estas flores y estrellas iluminan la inmensidad, tu sonrisa ilumina cada uno de mis días.</p>
            <p class="modal-text"><strong>¡Feliz Día de las Flores Amarillas, Mi Amor!</strong><br>Te amo infinitamente.</p>
            <button class="modal-btn" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const spaceContainer = document.getElementById('space-container');
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = spaceContainer.clientWidth;
            canvas.height = spaceContainer.clientHeight;
        }
        resizeCanvas();

        /* GENERACIÓN DE GALAXIA FUCSIA EN PERSPECTIVA 3D CON HAZ EN V */
        const stars = [];
        const numStars = 3000;
        const arms = 2;

        // Disco de la galaxia inclinado
        for (let i = 0; i < numStars; i++) {
            const distance = Math.pow(Math.random(), 1.8) * (canvas.width * 0.38);
            const armAngle = (Math.floor(Math.random() * arms) * ((Math.PI * 2) / arms));
            const spiralAngle = distance * 0.0022;
            const totalAngle = armAngle + spiralAngle + (Math.random() - 0.5) * 0.5;

            // Paleta fucsia / magenta brillante
            const colors = ['#ff00a0', '#ff33b5', '#e000ff', '#ff80df', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            stars.push({
                distance,
                angle: totalAngle,
                speed: (0.0003 + (1 / (distance + 60)) * 0.18),
                size: Math.random() * 2.6 + 0.8,
                color,
                alpha: Math.random() * 0.85 + 0.15,
                type: 'galaxy'
            });
        }

        // Partículas proyectadas hacia arriba en forma de "V"
        const vParticles = [];
        for (let i = 0; i < 400; i++) {
            const side = Math.random() < 0.5 ? -1 : 1;
            const progress = Math.random();
            const angleDeg = (side === -1 ? 125 : 55) + (Math.random() - 0.5) * 12;
            const rad = (angleDeg * Math.PI) / 180;
            const speed = Math.random() * 1.5 + 0.5;

            vParticles.push({
                x: 0,
                y: 0,
                vx: Math.cos(rad) * speed * 250,
                vy: -Math.sin(rad) * speed * 250,
                progress: Math.random(),
                size: Math.random() * 3 + 1,
                color: Math.random() < 0.8 ? '#ff00a0' : '#ff99e6'
            });
        }

        function drawGalaxy() {
            ctx.fillStyle = 'rgba(2, 1, 5, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 80; // Centro desplazado levemente abajo para equilibrar la V

            ctx.globalCompositeOperation = 'screen';

            // Resplandor central dorado/blanco brillante
            const coreGlow = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 180);
            coreGlow.addColorStop(0, 'rgba(255, 255, 200, 1)');
            coreGlow.addColorStop(0.15, 'rgba(255, 200, 0, 0.9)');
            coreGlow.addColorStop(0.4, 'rgba(255, 0, 128, 0.5)');
            coreGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = coreGlow;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Renderizar partículas del disco galáctico inclinado en 3D (Eje Y comprimido)
            const tiltY = 0.28; // Compresión vertical para efecto de disco en perspectiva

            stars.forEach(star => {
                star.angle += star.speed;
                const rawX = Math.cos(star.angle) * star.distance;
                const rawY = Math.sin(star.angle) * star.distance;

                const currentX = centerX + rawX;
                const currentY = centerY + rawY * tiltY;

                ctx.fillStyle = star.color;
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(currentX, currentY, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Renderizar el haz de luz en forma de "V" superior
            vParticles.forEach(p => {
                p.progress += 0.005;
                if (p.progress > 1) p.progress = 0;

                const currentX = centerX + p.vx * p.progress;
                const currentY = centerY + p.vy * p.progress;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = (1 - p.progress) * 0.9;
                ctx.beginPath();
                ctx.arc(currentX, currentY, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;

            requestAnimationFrame(drawGalaxy);
        }
        drawGalaxy();

        /* GIRASOL REALISTA DETALLADO */
        function getSunflowerSVG() {
            return `
            <svg class="sunflower-svg" viewBox="0 0 100 100">
                <defs>
                    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#1b0a02"/>
                        <stop offset="65%" stop-color="#3d1d06"/>
                        <stop offset="85%" stop-color="#5c2e0b"/>
                        <stop offset="100%" stop-color="#8a4812"/>
                    </radialGradient>
                    <linearGradient id="petalGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#e67e22"/>
                        <stop offset="40%" stop-color="#f1c40f"/>
                        <stop offset="100%" stop-color="#ffeb3b"/>
                    </linearGradient>
                    <linearGradient id="petalGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#d35400"/>
                        <stop offset="50%" stop-color="#f39c12"/>
                        <stop offset="100%" stop-color="#fff176"/>
                    </linearGradient>
                </defs>
                <g fill="#2e7d32" opacity="0.9">
                    <path d="M 50 50 Q 15 15 10 45 Q 35 65 50 50 Z" />
                    <path d="M 50 50 Q 85 15 90 45 Q 65 65 50 50 Z" />
                    <path d="M 50 50 Q 15 85 45 90 Q 65 65 50 50 Z" />
                    <path d="M 50 50 Q 85 85 90 55 Q 65 35 50 50 Z" />
                </g>
                <g fill="url(#petalGrad2)">
                    <ellipse cx="50" cy="8" rx="4" ry="18"/>
                    <ellipse cx="50" cy="92" rx="4" ry="18"/>
                    <ellipse cx="8" cy="50" rx="18" ry="4"/>
                    <ellipse cx="92" cy="50" rx="18" ry="4"/>
                    <ellipse cx="20" cy="20" rx="4.5" ry="18" transform="rotate(-45 20 20)"/>
                    <ellipse cx="80" cy="80" rx="4.5" ry="18" transform="rotate(-45 80 80)"/>
                    <ellipse cx="20" cy="80" rx="4.5" ry="18" transform="rotate(45 20 80)"/>
                    <ellipse cx="80" cy="20" rx="4.5" ry="18" transform="rotate(45 80 20)"/>
                </g>
                <g fill="url(#petalGrad1)">
                    <ellipse cx="50" cy="12" rx="4" ry="16" transform="rotate(15 50 12)"/>
                    <ellipse cx="50" cy="88" rx="4" ry="16" transform="rotate(15 50 88)"/>
                    <ellipse cx="12" cy="50" rx="16" ry="4" transform="rotate(15 12 50)"/>
                    <ellipse cx="88" cy="50" rx="16" ry="4" transform="rotate(15 88 50)"/>
                    <ellipse cx="24" cy="24" rx="4" ry="16" transform="rotate(-30 24 24)"/>
                    <ellipse cx="76" cy="76" rx="4" ry="16" transform="rotate(-30 76 76)"/>
                    <ellipse cx="24" cy="76" rx="4" ry="16" transform="rotate(60 24 76)"/>
                    <ellipse cx="76" cy="24" rx="4" ry="16" transform="rotate(60 76 24)"/>
                </g>
                <circle cx="50" cy="50" r="19" fill="url(#centerGrad)"/>
                <circle cx="50" cy="50" r="16" fill="none" stroke="#aa5500" stroke-width="2" stroke-dasharray="3,2"/>
                <circle cx="50" cy="50" r="11" fill="none" stroke="#773300" stroke-width="2" stroke-dasharray="2,2"/>
                <circle cx="50" cy="50" r="6" fill="#1b0a02"/>
            </svg>`;
        }

        const words = [
            "INFINITO ∞", "SIEMPRE", "MI CORAZÓN ES TUYO", "CONTIGO SIEMPRE", 
            "AMOR ETERNO", "MI SOL", "MI UNIVERSO", "TE AMO", "ERES MI CIELO"
        ];

        /* ELEMENTOS ORBITANDO EN EL DISCO INCLINADO 3D */
        const totalItems = 32;
        const orbitingItems = [];
        const minRadius = 220;
        const maxRadius = spaceContainer.clientWidth * 0.42;

        for (let i = 0; i < totalItems; i++) {
            const item = document.createElement('div');
            item.className = 'floating-item';

            const word = words[Math.floor(Math.random() * words.length)];
            const isHighlight = word.includes("INFINITO") || word.includes("SIEMPRE");

            item.innerHTML = `
                ${getSunflowerSVG()}
                <span class="tag-text ${isHighlight ? 'highlight' : ''}">${word}</span>
            `;

            spaceContainer.appendChild(item);

            const radius = minRadius + Math.random() * (maxRadius - minRadius);
            const initialAngle = Math.random() * Math.PI * 2;
            const speed = (0.0003 + (1 / radius) * 0.12);
            const scale = 0.75 + Math.random() * 0.45;

            orbitingItems.push({
                element: item,
                radius: radius,
                angle: initialAngle,
                speed: speed,
                scale: scale
            });
        }

        function animateOrbit() {
            const centerX = spaceContainer.clientWidth / 2;
            const centerY = spaceContainer.clientHeight / 2 + 80;
            const tiltY = 0.28; // Mismo factor de inclinación que la galaxia

            orbitingItems.forEach(item => {
                item.angle += item.speed;

                const rawX = Math.cos(item.angle) * item.radius;
                const rawY = Math.sin(item.angle) * item.radius;

                const x = centerX + rawX;
                const y = centerY + rawY * tiltY;

                // Escala según la posición en profundidad (z-index simulated)
                const depthScale = item.scale * (0.8 + (rawY / item.radius) * 0.2);

                item.element.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%) scale(${depthScale})`;
            });

            requestAnimationFrame(animateOrbit);
        }
        animateOrbit();

        /* ARRASTRE Y PINCH-TO-ZOOM EN MÓVIL Y PC */
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = -spaceContainer.clientWidth / 3;
        let currentY = -spaceContainer.clientHeight / 3;
        let targetX = currentX, targetY = currentY;

        let scale = 1;
        let targetScale = 1;
        let initialPinchDist = null;

        function updatePhysics() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;
            scale += (targetScale - scale) * 0.08;

            spaceContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) scale(${scale})`;
            requestAnimationFrame(updatePhysics);
        }
        updatePhysics();

        function getPinchDistance(e) {
            return Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - targetX;
                startY = e.touches[0].clientY - targetY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDist = getPinchDistance(e);
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                targetX = e.touches[0].clientX - startX;
                targetY = e.touches[0].clientY - startY;
            } else if (e.touches.length === 2 && initialPinchDist) {
                const newDist = getPinchDistance(e);
                const factor = newDist / initialPinchDist;
                targetScale = Math.min(Math.max(scale * factor, 0.4), 2.5);
                initialPinchDist = newDist;
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialPinchDist = null;
            if (e.touches.length === 0) isDragging = false;
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomAmount = e.deltaY * -0.001;
            targetScale = Math.min(Math.max(targetScale + zoomAmount, 0.4), 2.5);
        }, { passive: false });

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - targetX;
            startY = e.clientY - targetY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            targetX = e.clientX - startX;
            targetY = e.clientY - startY;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        function closeModal() {
            document.getElementById('cardModal').classList.add('hidden');
        }
    </script>
</body>
</html>
