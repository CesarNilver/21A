<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Girasoles - Edel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03030c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 235, 150, 0.8);
            font-size: 13px;
            pointer-events: none;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
        }
    </style>
</head>
<body>

<canvas id="spaceCanvas"></canvas>
<div class="hint">✨ Arrastra para girar la galaxia de girasoles ✨</div>

<script>
const canvas = document.getElementById('spaceCanvas');
const ctx = canvas.getContext('2d');

let width, height, centerX, centerY;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    centerX = width / 2;
    centerY = height / 2 + 60;
}

window.addEventListener('resize', resize);
resize();

// --- Control de Interacción ---
let rotX = 0.4;
let rotY = 0;
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };

window.addEventListener('mousedown', (e) => {
    isDragging = true;
    previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMousePosition.x;
    const deltaY = e.clientY - previousMousePosition.y;

    rotY += deltaX * 0.005;
    rotX += deltaY * 0.005;
    rotX = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, rotX));

    previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => isDragging = false);

window.addEventListener('touchstart', (e) => {
    isDragging = true;
    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

window.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const deltaX = e.touches[0].clientX - previousMousePosition.x;
    const deltaY = e.touches[0].clientY - previousMousePosition.y;

    rotY += deltaX * 0.005;
    rotX += deltaY * 0.005;
    rotX = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, rotX));

    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

window.addEventListener('touchend', () => isDragging = false);

// --- Generación de Partículas ---
const GALAXY_PARTICLES = 5000;
const HEART_PARTICLES = 2000;

const galaxy = [];
for (let i = 0; i < GALAXY_PARTICLES; i++) {
    const isNucleus = i < 500;
    let dist, angle, color, size;

    if (isNucleus) {
        dist = Math.random() * 50;
        angle = Math.random() * Math.PI * 2;
        color = `rgba(255, ${215 + Math.floor(Math.random() * 40)}, ${Math.floor(Math.random() * 100)}, ${0.8 + Math.random() * 0.2})`;
        size = 1.5 + Math.random() * 2.5;
    } else {
        angle = Math.random() * Math.PI * 4;
        dist = 45 + Math.pow(Math.random(), 1.4) * (Math.min(width, height) * 0.48);
        
        const r = 255;
        const g = Math.floor(180 + Math.random() * 75);
        const b = Math.floor(Math.random() * 60);
        color = `rgba(${r}, ${g}, ${b}, ${0.35 + Math.random() * 0.55})`;
        size = 0.8 + Math.random() * 1.8;
    }

    galaxy.push({
        dist: dist,
        angle: angle,
        speed: 0.001 + (100 / (dist + 50)) * 0.0005,
        color: color,
        size: size
    });
}

const heart = [];
for (let i = 0; i < HEART_PARTICLES; i++) {
    const t = Math.random() * Math.PI * 2;
    const xP = 16 * Math.pow(Math.sin(t), 3);
    const yP = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

    const scale = 11 + Math.random() * 1.5;
    const x = xP * scale + (Math.random() - 0.5) * 8;
    const y = -yP * scale + (Math.random() - 0.5) * 8 - 220;

    heart.push({
        baseX: x,
        baseY: y,
        size: 1 + Math.random() * 2,
        color: `rgba(255, ${Math.floor(190 + Math.random() * 65)}, ${Math.floor(Math.random() * 50)}, `,
        alpha: 0.6 + Math.random() * 0.4
    });
}

// --- GIRASOLES REALISTAS Y MÁS FRASES PARA EDEL ---
const sunflowersRaw = [
    { x: -330, y: -160, radius: 24, phrase: 'Eres mi sol en cada mañana 🌻' },
    { x: -180, y: -240, radius: 22, phrase: 'Flores amarillas para el amor de mi vida 💛' },
    { x: 160, y: -230, radius: 25, phrase: 'Tu sonrisa ilumina todo mi universo ✨' },
    { x: 340, y: -130, radius: 21, phrase: 'Contigo cada segundo vale la pena' },
    { x: -380, y: -30, radius: 20, phrase: 'Para la chica más hermosa del mundo 🌼' },
    { x: 350, y: -20, radius: 26, phrase: 'Mi lugar favorito siempre será a tu lado' },
    { x: -320, y: 110, radius: 23, phrase: 'Eres mi casualidad más bonita 💛' },
    { x: 120, y: 140, radius: 22, phrase: 'Cada día te amo un poco más, Edel' },
    { x: -160, y: 190, radius: 20, phrase: 'Gracias por llenar mi vida de luz 🌻' },
    { x: 290, y: 180, radius: 24, phrase: 'Un mar de girasoles para tu lindo corazón' },
    { x: -260, y: 240, radius: 22, phrase: 'Eres mi sueño hecho realidad ✨' },
    { x: 180, y: 260, radius: 25, phrase: 'Juntos hoy, mañana y siempre' },
    { x: -110, y: -130, radius: 19, phrase: 'Tú haces mi mundo más bonito 💛' },
    { x: 80, y: -140, radius: 21, phrase: 'Tu amor hace florecer mi alma 🌻' },
    { x: -410, y: 70, radius: 20, phrase: 'Amo la luz de tus ojitos' },
    { x: 400, y: 80, radius: 22, phrase: 'No hay nadie en el mundo como tú ✨' },
    { x: 0, y: 290, radius: 26, phrase: 'Eres mi regalo más preciado del universo 💛' }
];

const floaters = sunflowersRaw.map(f => {
    const dist = Math.sqrt(f.x * f.x + f.y * f.y);
    const angle = Math.atan2(f.y, f.x);
    return { ...f, dist, angle };
});

// Dibujar un girasol realista con capas de pétalos y semillas
function drawRealisticSunflower(x, y, radius) {
    ctx.save();
    ctx.translate(x, y);

    // 1. Capas externas de pétalos
    const petalLayers = [
        { count: 16, lenRatio: 1.15, widthRatio: 0.32, color: '#FFA500' }, // Pétalos traseros oscuros/naranjas
        { count: 18, lenRatio: 1.0,  widthRatio: 0.30, color: '#FFD700' }, // Capa media brillante
        { count: 14, lenRatio: 0.82, widthRatio: 0.28, color: '#FFEE55' }  // Capa interna clara
    ];

    petalLayers.forEach((layer, layerIdx) => {
        const offset = (layerIdx * Math.PI) / layer.count;
        for (let i = 0; i < layer.count; i++) {
            const angle = (i * Math.PI * 2) / layer.count + offset;
            ctx.save();
            ctx.rotate(angle);

            ctx.beginPath();
            const pLen = radius * layer.lenRatio;
            const pWidth = radius * layer.widthRatio;

            // Forma puntiaguda y suave del pétalo del girasol
            ctx.moveTo(0, -radius * 0.3);
            ctx.bezierCurveTo(-pWidth, -radius * 0.6, -pWidth * 0.8, -pLen, 0, -pLen * 1.1);
            ctx.bezierCurveTo(pWidth * 0.8, -pLen, pWidth, -radius * 0.6, 0, -radius * 0.3);

            ctx.fillStyle = layer.color;
            ctx.shadowColor = '#FF8C00';
            ctx.shadowBlur = 4;
            ctx.fill();
            ctx.restore();
        }
    });

    // 2. Centro oscuro del girasol (Semillas en espiral)
    const centerRadius = radius * 0.42;
    ctx.beginPath();
    ctx.arc(0, 0, centerRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#2A1508';
    ctx.shadowColor = '#000000';
    ctx.shadowBlur = 6;
    ctx.fill();

    // Textura de semillas en el centro
    const seedCount = 45;
    const goldenAngle = 137.5 * (Math.PI / 180);
    for (let i = 0; i < seedCount; i++) {
        const r = Math.sqrt(i / seedCount) * (centerRadius * 0.88);
        const theta = i * goldenAngle;
        const sX = r * Math.cos(theta);
        const sY = r * Math.sin(theta);

        ctx.beginPath();
        ctx.arc(sX, sY, radius * 0.038, 0, Math.PI * 2);
        ctx.fillStyle = i % 2 === 0 ? '#5C3317' : '#8B4513';
        ctx.fill();
    }

    // Borde brillante en el centro
    ctx.beginPath();
    ctx.arc(0, 0, centerRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
}

let pulseTime = 0;

function animate() {
    ctx.fillStyle = '#03030c';
    ctx.fillRect(0, 0, width, height);

    pulseTime += 0.03;
    const pulse = (Math.sin(pulseTime) + 1) / 2;

    // 1. Dibujar la galaxia amarilla/dorada
    galaxy.forEach(p => {
        p.angle += p.speed;

        const rawX = Math.cos(p.angle + rotY) * p.dist;
        const rawY = Math.sin(p.angle + rotY) * p.dist;

        const screenX = centerX + rawX;
        const screenY = centerY + rawY * Math.sin(rotX);

        ctx.beginPath();
        ctx.arc(screenX, screenY, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
    });

    // 2. Núcleo resplandeciente
    const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 70);
    gradient.addColorStop(0, 'rgba(255, 255, 230, 1)');
    gradient.addColorStop(0.2, 'rgba(255, 215, 0, 0.9)');
    gradient.addColorStop(0.6, 'rgba(255, 140, 0, 0.4)');
    gradient.addColorStop(1, 'transparent');

    ctx.beginPath();
    ctx.arc(centerX, centerY, 70, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // 3. Corazón amarillo/dorado
    const currentScale = 1 + pulse * 0.08;

    heart.forEach(p => {
        const screenX = centerX + p.baseX * currentScale;
        const screenY = centerY + p.baseY * currentScale;

        ctx.beginPath();
        ctx.arc(screenX, screenY, p.size * (1 + pulse * 0.3), 0, Math.PI * 2);
        ctx.fillStyle = p.color + (p.alpha * (0.7 + pulse * 0.3)) + ')';
        ctx.fill();
    });

    // Texto EDEL en dorado
    const heartCenterY = centerY - 220 * currentScale;
    
    ctx.save();
    ctx.font = `bold ${34 + pulse * 4}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 25 + pulse * 10;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('EDEL', centerX, heartCenterY);
    ctx.restore();

    // 4. Dibujar Girasoles y Frases
    floaters.forEach(f => {
        const floatY = Math.sin(pulseTime + f.dist) * 5;

        const currentAngle = f.angle + rotY;
        const rawX = Math.cos(currentAngle) * f.dist;
        const rawY = Math.sin(currentAngle) * f.dist;

        const screenX = centerX + rawX;
        const screenY = centerY + rawY * Math.sin(rotX) + floatY;

        drawRealisticSunflower(screenX, screenY, f.radius);

        // Texto de frase bonita
        ctx.save();
        ctx.font = "bold 12px 'Segoe UI', sans-serif";
        ctx.fillStyle = '#FFFDE7';
        ctx.shadowColor = '#FF8C00';
        ctx.shadowBlur = 8;
        ctx.textAlign = 'center';
        
        const lines = f.phrase.split('\n');
        lines.forEach((line, index) => {
            ctx.fillText(line, screenX, screenY + f.radius + 16 + (index * 14));
        });
        
        ctx.restore();
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
