<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flores Amarillas en la Galaxia Infinita</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010103;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Evita que el navegador del móvil haga scroll por defecto */
        }

        /* Viewport interactivo */
        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
            overflow: hidden;
            touch-action: none;
        }

        #viewport:active {
            cursor: grabbing;
        }

        /* Lienzo interactivo extendido para permitir movimiento libre en móvil */
        #space-container {
            position: absolute;
            width: 300vw;
            height: 300vh;
            top: -100vh;
            left: -100vw;
            will-change: transform;
            touch-action: none;
        }

        #galaxyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Agujero negro central con resplandor */
        .black-hole-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 180px;
            height: 180px;
            margin-top: -90px;
            margin-left: -90px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .accretion-disk {
            position: absolute;
            width: 220%;
            height: 220%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 235, 120, 0.95) 0%, rgba(255, 140, 0, 0.8) 35%, rgba(220, 20, 60, 0.45) 60%, rgba(0,0,0,0) 78%);
            filter: blur(10px);
            animation: rotateDisk 10s linear infinite;
        }

        .black-hole-core {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #000000;
            box-shadow: 0 0 25px 10px #ffffff,
                        0 0 50px 20px #ffcc00,
                        0 0 90px 40px #ff3300,
                        0 0 140px 60px rgba(180, 0, 255, 0.35);
        }

        @keyframes rotateDisk {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.04); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Elementos flotantes */
        .floating-item {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            z-index: 15;
            will-change: transform;
        }

        .sunflower-svg {
            width: 58px;
            height: 58px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.95));
        }

        .tag-text {
            background: rgba(12, 6, 18, 0.85);
            padding: 7px 16px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            color: #fffdf0;
            text-shadow: 0 0 8px #ffcc00;
            border: 1px solid rgba(255, 215, 0, 0.55);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
        }

        .tag-text.highlight {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            border: 1px solid rgba(255, 240, 160, 0.95);
            text-shadow: 0 0 14px #ffee00, 0 0 26px #ff6600;
            background: rgba(35, 15, 28, 0.92);
        }

        /* Modal romántico */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .modal-card {
            background: linear-gradient(145deg, rgba(30, 12, 25, 0.95), rgba(12, 5, 18, 0.98));
            border: 2px solid #ff4433;
            box-shadow: 0 0 35px rgba(255, 68, 51, 0.6), 0 0 15px rgba(255, 200, 0, 0.4);
            border-radius: 24px;
            padding: 35px;
            max-width: 440px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 44px;
            color: #ffc233;
            margin-bottom: 18px;
            text-shadow: 0 0 15px rgba(255, 194, 51, 0.7);
        }

        .modal-text {
            font-size: 15px;
            line-height: 1.6;
            color: #f3e5d8;
            margin-bottom: 15px;
            font-style: italic;
        }

        .modal-btn {
            background: linear-gradient(135deg, #ff3333, #b30000);
            color: white;
            border: none;
            padding: 12px 34px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 22px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
            transition: transform 0.2s, background 0.2s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ff5555, #cc0000);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="space-container">
            <canvas id="galaxyCanvas"></canvas>
            <div class="black-hole-container">
                <div class="accretion-disk"></div>
                <div class="black-hole-core"></div>
            </div>
        </div>
    </div>

    <!-- Modal con mensaje final -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal-card">
            <h1 class="modal-title">Mi Amor...</h1>
            <p class="modal-text">Eres la coincidencia más hermosa que me pudo pasar.</p>
            <p class="modal-text">Así como estas flores y estrellas iluminan la inmensidad, tu sonrisa ilumina cada uno de mis días.</p>
            <p class="modal-text"><strong>¡Feliz Día de las Flores Amarillas, Mi Amor!</strong><br>Te amo infinitamente.</p>
            <button class="modal-btn" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const spaceContainer = document.getElementById('space-container');
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = spaceContainer.clientWidth;
            canvas.height = spaceContainer.clientHeight;
        }
        resizeCanvas();

        /* FONDO ESPACIAL 360° CON ESTRELLAS Y NEBULOSA */
        const stars = [];
        const numStars = 2200;
        const arms = 4;

        for (let i = 0; i < numStars; i++) {
            const distance = Math.pow(Math.random(), 2) * (canvas.width * 0.48);
            const armAngle = (Math.floor(Math.random() * arms) * ((Math.PI * 2) / arms));
            const spiralAngle = distance * 0.0018;
            const totalAngle = armAngle + spiralAngle + (Math.random() - 0.5) * 0.6;

            const x = canvas.width / 2 + Math.cos(totalAngle) * distance;
            const y = canvas.height / 2 + Math.sin(totalAngle) * distance;

            const colors = ['#fff1a8', '#ffb74d', '#e1bee7', '#80deea', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            stars.push({
                x, y,
                distance,
                angle: totalAngle,
                speed: (0.0002 + (1 / (distance + 80)) * 0.25),
                size: Math.random() * 2.2 + 0.5,
                color,
                alpha: Math.random() * 0.85 + 0.15
            });
        }

        function drawGalaxy() {
            ctx.fillStyle = 'rgba(1, 1, 3, 0.22)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.globalCompositeOperation = 'screen';
            const nebula = ctx.createRadialGradient(centerX, centerY, 80, centerX, centerY, canvas.width * 0.46);
            nebula.addColorStop(0, 'rgba(255, 170, 30, 0.28)');
            nebula.addColorStop(0.3, 'rgba(170, 40, 240, 0.18)');
            nebula.addColorStop(0.65, 'rgba(20, 70, 190, 0.1)');
            nebula.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.angle += star.speed;
                const currentX = centerX + Math.cos(star.angle) * star.distance;
                const currentY = centerY + Math.sin(star.angle) * star.distance;

                ctx.fillStyle = star.color;
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(currentX, currentY, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;

            requestAnimationFrame(drawGalaxy);
        }
        drawGalaxy();

        /* DIBUJO VECTORIAL DE GIRASOL HERMOSO Y DETALLADO */
        function getSunflowerSVG() {
            return `
            <svg class="sunflower-svg" viewBox="0 0 100 100">
                <!-- Hojas verdes de base -->
                <g fill="#2e7d32">
                    <path d="M 50 50 Q 20 10 10 40 Q 30 60 50 50 Z" />
                    <path d="M 50 50 Q 80 10 90 40 Q 70 60 50 50 Z" />
                    <path d="M 50 50 Q 10 80 40 90 Q 60 70 50 50 Z" />
                    <path d="M 50 50 Q 80 80 90 60 Q 70 40 50 50 Z" />
                </g>
                <!-- Capa externa de pétalos amarillos cálidos -->
                <g fill="#ffc107">
                    <ellipse cx="50" cy="10" rx="5" ry="17"/>
                    <ellipse cx="50" cy="90" rx="5" ry="17"/>
                    <ellipse cx="10" cy="50" rx="17" ry="5"/>
                    <ellipse cx="90" cy="50" rx="17" ry="5"/>
                    <ellipse cx="21" cy="21" rx="6" ry="17" transform="rotate(-45 21 21)"/>
                    <ellipse cx="79" cy="79" rx="6" ry="17" transform="rotate(-45 79 79)"/>
                    <ellipse cx="21" cy="79" rx="6" ry="17" transform="rotate(45 21 79)"/>
                    <ellipse cx="79" cy="21" rx="6" ry="17" transform="rotate(45 79 21)"/>
                </g>
                <!-- Capa interna de pétalos dorado/naranja -->
                <g fill="#ff9800">
                    <ellipse cx="50" cy="16" rx="4.5" ry="14"/>
                    <ellipse cx="50" cy="84" rx="4.5" ry="14"/>
                    <ellipse cx="16" cy="50" rx="14" ry="4.5"/>
                    <ellipse cx="84" cy="50" rx="14" ry="4.5"/>
                    <ellipse cx="26" cy="26" rx="5" ry="14" transform="rotate(-45 26 26)"/>
                    <ellipse cx="74" cy="74" rx="5" ry="14" transform="rotate(-45 74 74)"/>
                    <ellipse cx="26" cy="74" rx="5" ry="14" transform="rotate(45 26 74)"/>
                    <ellipse cx="74" cy="26" rx="5" ry="14" transform="rotate(45 74 26)"/>
                </g>
                <!-- Centro de la flor -->
                <circle cx="50" cy="50" r="18" fill="#4e2608"/>
                <circle cx="50" cy="50" r="14" fill="#2d1303"/>
                <circle cx="50" cy="50" r="8" fill="#180901"/>
            </svg>`;
        }

        const words = [
            "Mi sol", "Mi amor", "Mi destino", "Mi cielo", "Esperanza", 
            "Libertad", "Felicidad", "Pasión", "Reina", "Mi razón", 
            "Eternidad", "Brillas", "Sueños", "Mi flor", "Contigo", 
            "Mi calma", "Mi universo", "Dulzura", "Ternura", "Mi fiesta"
        ];

        /* ELEMENTOS EN ÓRBITA */
        const totalItems = 48;
        const orbitingItems = [];
        const minRadius = 180;
        const maxRadius = spaceContainer.clientWidth * 0.44;

        for (let i = 0; i < totalItems; i++) {
            const item = document.createElement('div');
            item.className = 'floating-item';

            const word = words[Math.floor(Math.random() * words.length)];
            const isHighlight = Math.random() < 0.25;

            item.innerHTML = `
                ${getSunflowerSVG()}
                <span class="tag-text ${isHighlight ? 'highlight' : ''}">${word}</span>
            `;

            spaceContainer.appendChild(item);

            const radius = minRadius + Math.random() * (maxRadius - minRadius);
            const initialAngle = Math.random() * Math.PI * 2;
            const direction = Math.random() < 0.85 ? 1 : -1;
            const speed = (0.0003 + (1 / radius) * 0.12) * direction;
            const scale = 0.75 + Math.random() * 0.45;

            orbitingItems.push({
                element: item,
                radius: radius,
                angle: initialAngle,
                speed: speed,
                scale: scale
            });
        }

        function animateOrbit() {
            const centerX = spaceContainer.clientWidth / 2;
            const centerY = spaceContainer.clientHeight / 2;

            orbitingItems.forEach(item => {
                item.angle += item.speed;

                const x = centerX + Math.cos(item.angle) * item.radius;
                const y = centerY + Math.sin(item.angle) * item.radius;

                item.element.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%) scale(${item.scale})`;
            });

            requestAnimationFrame(animateOrbit);
        }
        animateOrbit();

        /* CONTROL TÁCTIL TOTALMENTE COMPATIBLE CON MÓVIL Y RATÓN */
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = -spaceContainer.clientWidth / 3;
        let currentY = -spaceContainer.clientHeight / 3;
        let targetX = currentX, targetY = currentY;

        function updatePhysics() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            spaceContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            requestAnimationFrame(updatePhysics);
        }
        updatePhysics();

        // Obtener posición unificada (Móvil y PC)
        function getPointerPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function onPointerStart(e) {
            isDragging = true;
            const pos = getPointerPos(e);
            startX = pos.x - targetX;
            startY = pos.y - targetY;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const pos = getPointerPos(e);
            targetX = pos.x - startX;
            targetY = pos.y - startY;
        }

        function onPointerEnd() {
            isDragging = false;
        }

        // Eventos en Móvil y PC
        viewport.addEventListener('mousedown', onPointerStart);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerEnd);

        viewport.addEventListener('touchstart', onPointerStart, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerEnd);

        function closeModal() {
            document.getElementById('cardModal').classList.add('hidden');
        }
    </script>
</body>
</html>
