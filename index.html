<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Amarillas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #universe {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000000;
        }

        /* Disco Galáctico Inclinado Fijo (Perspectiva exacta de la captura) */
        #galaxy-disk {
            position: absolute;
            top: 35%;
            left: -20%;
            width: 140%;
            height: 120%;
            background: radial-gradient(ellipse at center, 
                        rgba(255, 140, 0, 0.9) 0%, 
                        rgba(180, 50, 0, 0.7) 12%, 
                        rgba(80, 20, 120, 0.85) 30%, 
                        rgba(40, 10, 80, 0.95) 55%, 
                        rgba(5, 2, 15, 1) 80%);
            border-radius: 50%;
            transform: rotateX(78deg) rotateZ(-3deg);
            transform-origin: center center;
            box-shadow: 0 0 80px rgba(180, 50, 200, 0.4);
        }

        /* Agujero negro central con resplandor dorado */
        .black-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            margin-top: -60px;
            margin-left: -60px;
            border-radius: 50%;
            background: #000000;
            box-shadow: 0 0 20px 8px #ffffff,
                        0 0 45px 18px #ff9900,
                        0 0 80px 35px #ff3300;
            z-index: 10;
        }

        /* Canvas de estrellas en el disco */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        /* Elementos flotantes de girasoles y etiquetas */
        .floating-item {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            z-index: 20;
        }

        /* Girasol estilizado identico a la captura */
        .sunflower-container {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.9));
        }

        .sunflower-svg {
            width: 100%;
            height: 100%;
        }

        /* Etiqueta de texto con borde dorado y resplandor */
        .tag-text {
            background: rgba(10, 8, 5, 0.88);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            border: 1.5px solid #ffcc00;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.6);
            text-shadow: 0 0 8px #ffcc00;
        }

        .tag-text.highlight {
            font-size: 18px;
            font-weight: 800;
            border: 2px solid #ffee77;
            box-shadow: 0 0 18px rgba(255, 238, 119, 0.85);
        }

        /* Modal romántico */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .modal-card {
            background: linear-gradient(145deg, rgba(30, 15, 10, 0.95), rgba(10, 5, 15, 0.98));
            border: 2px solid #ffaa00;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
            border-radius: 24px;
            padding: 35px;
            max-width: 440px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 42px;
            color: #ffc233;
            margin-bottom: 18px;
        }

        .modal-text {
            font-size: 15px;
            line-height: 1.6;
            color: #ebdcd0;
            margin-bottom: 15px;
            font-style: italic;
        }

        .modal-btn {
            background: linear-gradient(135deg, #ff9900, #b35900);
            color: white;
            border: none;
            padding: 11px 32px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 12px rgba(255, 153, 0, 0.5);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="universe">
        <div id="galaxy-disk">
            <canvas id="starsCanvas"></canvas>
            <div class="black-hole"></div>
        </div>
    </div>

    <!-- Modal emergente -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal-card">
            <h1 class="modal-title">Mi Amor...</h1>
            <p class="modal-text">Eres la coincidencia más hermosa que me pudo pasar.</p>
            <p class="modal-text">Así como estas flores y estrellas iluminan la inmensidad, tu sonrisa ilumina cada uno de mis días.</p>
            <p class="modal-text"><strong>¡Feliz Día de las Flores Amarillas, Mi Amor!</strong><br>Te amo infinitamente.</p>
            <button class="modal-btn" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script>
        const universe = document.getElementById('universe');
        const disk = document.getElementById('galaxy-disk');
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = disk.clientWidth;
            canvas.height = disk.clientHeight;
        }
        resizeCanvas();

        /* Dibujar estrellas en el disco plano */
        for (let i = 0; i < 1800; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const size = Math.random() * 2 + 0.5;
            const alpha = Math.random() * 0.85 + 0.15;

            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }

        /* SVG del Girasol de la captura (pétalos amarillos, hojas verdes y centro oscuro) */
        function getSunflowerSVG() {
            return `
            <div class="sunflower-container">
                <svg class="sunflower-svg" viewBox="0 0 100 100">
                    <!-- Hojas verdes de fondo -->
                    <g fill="#2e7d32">
                        <path d="M 50 50 Q 10 20 5 45 Q 25 65 50 50 Z" />
                        <path d="M 50 50 Q 90 20 95 45 Q 75 65 50 50 Z" />
                        <path d="M 50 50 Q 10 80 20 95 Q 55 75 50 50 Z" />
                        <path d="M 50 50 Q 90 80 80 95 Q 45 75 50 50 Z" />
                    </g>
                    <!-- Pétalos amarillos -->
                    <g fill="#ffcc00">
                        <ellipse cx="50" cy="10" rx="6" ry="18"/>
                        <ellipse cx="50" cy="90" rx="6" ry="18"/>
                        <ellipse cx="10" cy="50" rx="18" ry="6"/>
                        <ellipse cx="90" cy="50" rx="18" ry="6"/>
                        <ellipse cx="21" cy="21" rx="6" ry="18" transform="rotate(-45 21 21)"/>
                        <ellipse cx="79" cy="79" rx="6" ry="18" transform="rotate(-45 79 79)"/>
                        <ellipse cx="21" cy="79" rx="6" ry="18" transform="rotate(45 21 79)"/>
                        <ellipse cx="79" cy="21" rx="6" ry="18" transform="rotate(45 79 21)"/>
                    </g>
                    <!-- Centro marrón del girasol -->
                    <circle cx="50" cy="50" r="18" fill="#3a1e05"/>
                    <circle cx="50" cy="50" r="14" fill="#200e02"/>
                </svg>
            </div>`;
        }

        const words = [
            "Mi sol", "Mi amor", "Mi destino", "Mi cielo", "Esperanza", 
            "Libertad", "Felicidad", "Pasión", "Reina", "Mi razón", 
            "Eternidad", "Brillas", "Sueños", "Mi flor", "Contigo", 
            "Mi calma", "Mi universo", "Dulzura", "Ternura", "Mi fiesta"
        ];

        /* Crear distribución de elementos en pantalla */
        const totalItems = 36;
        const floatingItems = [];

        for (let i = 0; i < totalItems; i++) {
            const item = document.createElement('div');
            item.className = 'floating-item';

            const word = words[Math.floor(Math.random() * words.length)];
            const isHighlight = Math.random() < 0.25;

            item.innerHTML = `
                ${getSunflowerSVG()}
                <span class="tag-text ${isHighlight ? 'highlight' : ''}">${word}</span>
            `;

            universe.appendChild(item);

            // Posicionamiento
            const posX = Math.random() * 90 + 5; // Porcentaje de ancho
            const posY = Math.random() * 65 + 25; // Porcentaje de alto
            const speed = (Math.random() * 0.15 + 0.05) * (Math.random() < 0.5 ? 1 : -1);
            const scale = 0.65 + Math.random() * 0.45;

            item.style.left = `${posX}vw`;
            item.style.top = `${posY}vh`;

            floatingItems.push({
                element: item,
                x: posX,
                speed: speed,
                scale: scale
            });
        }

        /* Movimiento 2D horizontal constante (sin rotaciones 3D) */
        function animate() {
            floatingItems.forEach(item => {
                item.x += item.speed * 0.1;

                if (item.x > 95) item.x = 2;
                if (item.x < 2) item.x = 95;

                item.element.style.left = `${item.x}vw`;
                item.element.style.transform = `scale(${item.scale})`;
            });

            requestAnimationFrame(animate);
        }
        animate();

        function closeModal() {
            document.getElementById('cardModal').classList.add('hidden');
        }
    </script>
</body>
</html>
