<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flores Amarillas Girando en la Galaxia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #020204;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
            overflow: hidden;
        }

        #viewport:active {
            cursor: grabbing;
        }

        #space-container {
            position: absolute;
            width: 180vw;
            height: 180vh;
            top: -40vh;
            left: -40vw;
            will-change: transform;
        }

        #galaxyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Agujero negro central */
        .black-hole-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160px;
            height: 160px;
            margin-top: -80px;
            margin-left: -80px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .accretion-disk {
            position: absolute;
            width: 180%;
            height: 180%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 230, 100, 0.9) 0%, rgba(255, 120, 0, 0.7) 35%, rgba(200, 0, 50, 0.4) 60%, rgba(0,0,0,0) 75%);
            filter: blur(8px);
            animation: rotateDisk 12s linear infinite;
        }

        .black-hole-core {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #000;
            box-shadow: 0 0 20px 8px #ffffff,
                        0 0 40px 16px #ffcc00,
                        0 0 80px 30px #ff3300,
                        0 0 120px 50px rgba(180, 0, 255, 0.3);
        }

        @keyframes rotateDisk {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.05); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Elementos en órbita giratoria */
        .floating-item {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            z-index: 15;
            will-change: transform;
        }

        .sunflower-svg {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 10px rgba(255, 220, 0, 0.95));
        }

        .tag-text {
            background: rgba(10, 5, 15, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #fffdf0;
            text-shadow: 0 0 8px #ffcc00;
            border: 1px solid rgba(255, 215, 0, 0.5);
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .tag-text.highlight {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            border: 1px solid rgba(255, 240, 150, 0.9);
            text-shadow: 0 0 12px #ffee00, 0 0 24px #ff6600;
            background: rgba(30, 12, 25, 0.88);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .modal-card {
            background: linear-gradient(145deg, rgba(30, 12, 25, 0.95), rgba(12, 5, 18, 0.98));
            border: 2px solid #ff4433;
            box-shadow: 0 0 35px rgba(255, 68, 51, 0.6), 0 0 15px rgba(255, 200, 0, 0.4);
            border-radius: 24px;
            padding: 35px;
            max-width: 440px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 44px;
            color: #ffc233;
            margin-bottom: 18px;
            text-shadow: 0 0 15px rgba(255, 194, 51, 0.7);
        }

        .modal-text {
            font-size: 15px;
            line-height: 1.6;
            color: #f3e5d8;
            margin-bottom: 15px;
            font-style: italic;
        }

        .modal-btn {
            background: linear-gradient(135deg, #ff3333, #b30000);
            color: white;
            border: none;
            padding: 12px 34px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 22px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
            transition: transform 0.2s, background 0.2s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ff5555, #cc0000);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="space-container">
            <canvas id="galaxyCanvas"></canvas>
            <div class="black-hole-container">
                <div class="accretion-disk"></div>
                <div class="black-hole-core"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="cardModal">
        <div class="modal-card">
            <h1 class="modal-title">Mi Amor...</h1>
            <p class="modal-text">Eres la coincidencia más hermosa que me pudo pasar.</p>
            <p class="modal-text">Así como estas flores y estrellas iluminan la inmensidad, tu sonrisa ilumina cada uno de mis días.</p>
            <p class="modal-text"><strong>¡Feliz Día de las Flores Amarillas, Mi Amor!</strong><br>Te amo infinitamente.</p>
            <button class="modal-btn" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const spaceContainer = document.getElementById('space-container');
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = spaceContainer.clientWidth;
            canvas.height = spaceContainer.clientHeight;
        }
        resizeCanvas();

        /* FONDO GALÁCTICO DE ESTRELLAS */
        const stars = [];
        const numStars = 1200;
        const arms = 3;
        const armWidth = 0.5;

        for (let i = 0; i < numStars; i++) {
            const distance = Math.pow(Math.random(), 2) * (canvas.width * 0.45);
            const armAngle = (Math.floor(Math.random() * arms) * ((Math.PI * 2) / arms));
            const spiralAngle = distance * 0.0025;
            const totalAngle = armAngle + spiralAngle + (Math.random() - 0.5) * armWidth;

            const x = canvas.width / 2 + Math.cos(totalAngle) * distance;
            const y = canvas.height / 2 + Math.sin(totalAngle) * distance;

            const colors = ['#ffea9f', '#ffaa44', '#e0aaff', '#70d6ff', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            stars.push({
                x, y,
                distance,
                angle: totalAngle,
                speed: (0.0003 + (1 / (distance + 50)) * 0.2),
                size: Math.random() * 2 + 0.5,
                color,
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        function drawGalaxy() {
            ctx.fillStyle = 'rgba(2, 2, 4, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.globalCompositeOperation = 'screen';
            const nebula = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, canvas.width * 0.4);
            nebula.addColorStop(0, 'rgba(255, 180, 50, 0.25)');
            nebula.addColorStop(0.3, 'rgba(180, 50, 255, 0.15)');
            nebula.addColorStop(0.6, 'rgba(30, 80, 200, 0.08)');
            nebula.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.angle += star.speed;
                const currentX = centerX + Math.cos(star.angle) * star.distance;
                const currentY = centerY + Math.sin(star.angle) * star.distance;

                ctx.fillStyle = star.color;
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(currentX, currentY, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;

            requestAnimationFrame(drawGalaxy);
        }
        drawGalaxy();

        /* SVG DE GIRASOL */
        function getSunflowerSVG() {
            return `
            <svg class="sunflower-svg" viewBox="0 0 100 100">
                <g fill="#ffcc00">
                    <ellipse cx="50" cy="12" rx="6" ry="16"/>
                    <ellipse cx="50" cy="88" rx="6" ry="16"/>
                    <ellipse cx="12" cy="50" rx="16" ry="6"/>
                    <ellipse cx="88" cy="50" rx="16" ry="6"/>
                    <ellipse cx="23" cy="23" rx="7" ry="16" transform="rotate(-45 23 23)"/>
                    <ellipse cx="77" cy="77" rx="7" ry="16" transform="rotate(-45 77 77)"/>
                    <ellipse cx="23" cy="77" rx="7" ry="16" transform="rotate(45 23 77)"/>
                    <ellipse cx="77" cy="23" rx="7" ry="16" transform="rotate(45 77 23)"/>
                </g>
                <g fill="#ff9900">
                    <ellipse cx="50" cy="18" rx="5" ry="14"/>
                    <ellipse cx="50" cy="82" rx="5" ry="14"/>
                    <ellipse cx="18" cy="50" rx="14" ry="5"/>
                    <ellipse cx="82" cy="50" rx="14" ry="5"/>
                </g>
                <circle cx="50" cy="50" r="18" fill="#3a1e05"/>
                <circle cx="50" cy="50" r="14" fill="#200e02"/>
            </svg>`;
        }

        const words = [
            "Mi sol", "Mi amor", "Mi destino", "Mi cielo", "Esperanza", 
            "Libertad", "Felicidad", "Pasión", "Reina", "Mi razón", 
            "Eternidad", "Brillas", "Sueños", "Mi flor", "Contigo", 
            "Mi calma", "Mi universo", "Dulzura", "Ternura", "Mi fiesta"
        ];

        /* CREACIÓN DE FLORES EN ÓRBITA CIRCULAR */
        const totalItems = 36;
        const orbitingItems = [];
        const minRadius = 160;  // Radio mínimo alrededor del agujero negro
        const maxRadius = spaceContainer.clientWidth * 0.42;

        for (let i = 0; i < totalItems; i++) {
            const item = document.createElement('div');
            item.className = 'floating-item';

            const word = words[Math.floor(Math.random() * words.length)];
            const isHighlight = Math.random() < 0.25;

            item.innerHTML = `
                ${getSunflowerSVG()}
                <span class="tag-text ${isHighlight ? 'highlight' : ''}">${word}</span>
            `;

            spaceContainer.appendChild(item);

            // Calcular radio y velocidad orbital (las más cercanas giran ligeramente más rápido)
            const radius = minRadius + Math.random() * (maxRadius - minRadius);
            const initialAngle = Math.random() * Math.PI * 2;
            const speed = (0.0004 + (1 / radius) * 0.15) * (Math.random() < 0.5 ? 1 : 1); 
            const scale = 0.7 + Math.random() * 0.4;

            orbitingItems.push({
                element: item,
                radius: radius,
                angle: initialAngle,
                speed: speed,
                scale: scale
            });
        }

        // Animación continua de órbita
        function animateOrbit() {
            const centerX = spaceContainer.clientWidth / 2;
            const centerY = spaceContainer.clientHeight / 2;

            orbitingItems.forEach(item => {
                item.angle += item.speed;

                const x = centerX + Math.cos(item.angle) * item.radius;
                const y = centerY + Math.sin(item.angle) * item.radius;

                item.element.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%) scale(${item.scale})`;
            });

            requestAnimationFrame(animateOrbit);
        }
        animateOrbit();

        /* ARRASTRE Y NAVEGACIÓN FLUIDA DE LA PANTALLA */
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;
        let targetX = 0, targetY = 0;

        function updatePhysics() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            spaceContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            requestAnimationFrame(updatePhysics);
        }
        updatePhysics();

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - targetX;
            startY = e.clientY - targetY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) {
                const mouseX = (e.clientX / window.innerWidth - 0.5) * -40;
                const mouseY = (e.clientY / window.innerHeight - 0.5) * -40;
                targetX = mouseX;
                targetY = mouseY;
                return;
            }
            targetX = e.clientX - startX;
            targetY = e.clientY - startY;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - targetX;
                startY = e.touches[0].clientY - targetY;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            targetX = e.touches[0].clientX - startX;
            targetY = e.touches[0].clientY - startY;
        }, { passive: true });

        window.addEventListener('touchend', () => isDragging = false);

        function closeModal() {
            document.getElementById('cardModal').classList.add('hidden');
        }
    </script>
</body>
</html>
