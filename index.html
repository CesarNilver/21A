<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Amor - Edel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03030c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            pointer-events: none;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>

<canvas id="spaceCanvas"></canvas>
<div class="hint">✨ Arrastra con el mouse para girar la galaxia ✨</div>

<script>
const canvas = document.getElementById('spaceCanvas');
const ctx = canvas.getContext('2d');

let width, height, centerX, centerY;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    centerX = width / 2;
    centerY = height / 2 + 60;
}

window.addEventListener('resize', resize);
resize();

// --- Control de Interacción ---
let rotX = 0.4;
let rotY = 0;
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };

window.addEventListener('mousedown', (e) => {
    isDragging = true;
    previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - previousMousePosition.x;
    const deltaY = e.clientY - previousMousePosition.y;

    rotY += deltaX * 0.005;
    rotX += deltaY * 0.005;
    rotX = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, rotX));

    previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => isDragging = false);

window.addEventListener('touchstart', (e) => {
    isDragging = true;
    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

window.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const deltaX = e.touches[0].clientX - previousMousePosition.x;
    const deltaY = e.touches[0].clientY - previousMousePosition.y;

    rotY += deltaX * 0.005;
    rotX += deltaY * 0.005;
    rotX = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, rotX));

    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});

window.addEventListener('touchend', () => isDragging = false);

// --- Generación de Partículas ---
const GALAXY_PARTICLES = 4500;
const HEART_PARTICLES = 1800;

const galaxy = [];
for (let i = 0; i < GALAXY_PARTICLES; i++) {
    const isNucleus = i < 400;
    let dist, angle, color, size;

    if (isNucleus) {
        dist = Math.random() * 45;
        angle = Math.random() * Math.PI * 2;
        color = `rgba(255, ${200 + Math.random() * 55}, ${Math.random() * 100}, ${0.8 + Math.random() * 0.2})`;
        size = 1.5 + Math.random() * 2;
    } else {
        angle = Math.random() * Math.PI * 4;
        dist = 40 + Math.pow(Math.random(), 1.5) * (Math.min(width, height) * 0.45);
        
        const r = Math.floor(150 + Math.random() * 105);
        const g = Math.floor(20 + Math.random() * 80);
        const b = Math.floor(200 + Math.random() * 55);
        color = `rgba(${r}, ${g}, ${b}, ${0.4 + Math.random() * 0.5})`;
        size = 0.8 + Math.random() * 1.5;
    }

    galaxy.push({
        dist: dist,
        angle: angle,
        speed: 0.001 + (100 / (dist + 50)) * 0.0005,
        color: color,
        size: size
    });
}

const heart = [];
for (let i = 0; i < HEART_PARTICLES; i++) {
    const t = Math.random() * Math.PI * 2;
    const xP = 16 * Math.pow(Math.sin(t), 3);
    const yP = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

    const scale = 11 + Math.random() * 1.5;
    const x = xP * scale + (Math.random() - 0.5) * 8;
    const y = -yP * scale + (Math.random() - 0.5) * 8 - 220;

    heart.push({
        baseX: x,
        baseY: y,
        size: 1 + Math.random() * 2,
        color: `rgba(255, ${Math.floor(20 + Math.random() * 100)}, ${Math.floor(180 + Math.random() * 75)}, `,
        alpha: 0.6 + Math.random() * 0.4
    });
}

// Convertimos notas y flores a coordenadas polares
const floatersRaw = [
    { type: 'text', text: 'MI CORAZÓN ES TUYO', x: -380, y: 30, color: '#FFFFFF', size: 16 },
    { type: 'text', text: 'CONTIGO SIEMPRE', x: -200, y: 80, color: '#FFFFFF', size: 15 },
    { type: 'text', text: 'SIEMPRE JUNTOS', x: -420, y: 160, color: '#FFFFFF', size: 22 },
    { type: 'text', text: 'AMOR ETERNO ✨', x: -120, y: -80, color: '#FFB6C1', size: 11 },
    { type: 'text', text: 'INFINITO ∞', x: 80, y: -70, color: '#FFFFFF', size: 12 },
    { type: 'text', text: 'CONTIGO SIEMPRE', x: 220, y: -40, color: '#FFB6C1', size: 13 },
    { type: 'text', text: 'Vengo a recordar\npor si se te olvida', x: 200, y: 30, color: '#E0E0E0', size: 11 },
    { type: 'text', text: 'MI CORAZÓN ES TUYO', x: 380, y: 80, color: '#FFFFFF', size: 18 },
    { type: 'text', text: 'INFINITO ∞', x: -50, y: 260, color: '#FFFFFF', size: 28 },
    
    { type: 'icon', x: -260, y: -20, radius: 28, text: 'te amo' },
    { type: 'icon', x: 180, y: 90, radius: 38, text: 'te amo ❤️' },
    { type: 'icon', x: 310, y: 80, radius: 26, text: 'te amo' },

    // --- BASTANTES FLORES AMARILLAS CON FRASES ---
    { type: 'flower', x: -310, y: -140, radius: 14, phrase: 'Eres mi sol en días nublados 🌻' },
    { type: 'flower', x: -180, y: -220, radius: 16, phrase: 'Flores amarillas para el amor de mi vida 💛' },
    { type: 'flower', x: 150, y: -210, radius: 15, phrase: 'Tu sonrisa ilumina mi universo ✨' },
    { type: 'flower', x: 330, y: -120, radius: 14, phrase: 'Haces que todo valga la pena' },
    { type: 'flower', x: -340, y: -30, radius: 12, phrase: 'Para la chica más linda del mundo 🌼' },
    { type: 'flower', x: 320, y: -20, radius: 16, phrase: 'Mi lugar favorito es a tu lado' },
    { type: 'flower', x: -290, y: 110, radius: 15, phrase: 'Eres la casualidad más bonita' },
    { type: 'flower', x: 110, y: 140, radius: 13, phrase: 'Cada día te amo un poco más 💛' },
    { type: 'flower', x: -140, y: 190, radius: 14, phrase: 'Gracias por existir, mi amor' },
    { type: 'flower', x: 280, y: 180, radius: 15, phrase: 'Un detalle amarillo para tu hermoso corazón' },
    { type: 'flower', x: -230, y: 240, radius: 13, phrase: 'Eres mi sueño hecho realidad 🌻' },
    { type: 'flower', x: 160, y: 250, radius: 14, phrase: 'Juntos por siempre' }
];

const floaters = floatersRaw.map(f => {
    const dist = Math.sqrt(f.x * f.x + f.y * f.y);
    const angle = Math.atan2(f.y, f.x);
    return { ...f, dist, angle };
});

// Función para dibujar flores amarillas
function drawYellowFlower(x, y, radius) {
    const petals = 6;
    ctx.save();
    ctx.translate(x, y);

    // Pétalos amarillos
    ctx.fillStyle = '#FFD700';
    ctx.shadowColor = '#FFA500';
    ctx.shadowBlur = 8;
    for (let i = 0; i < petals; i++) {
        const angle = (i * Math.PI * 2) / petals;
        const pX = Math.cos(angle) * (radius * 0.75);
        const pY = Math.sin(angle) * (radius * 0.75);
        
        ctx.beginPath();
        ctx.arc(pX, pY, radius * 0.55, 0, Math.PI * 2);
        ctx.fill();
    }

    // Centro brillante
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = '#FF8C00';
    ctx.shadowColor = '#FF8C00';
    ctx.shadowBlur = 5;
    ctx.fill();

    ctx.restore();
}

let pulseTime = 0;

function animate() {
    ctx.fillStyle = '#03030c';
    ctx.fillRect(0, 0, width, height);

    pulseTime += 0.03;
    const pulse = (Math.sin(pulseTime) + 1) / 2;

    // 1. Dibujar la galaxia
    galaxy.forEach(p => {
        p.angle += p.speed;

        const rawX = Math.cos(p.angle + rotY) * p.dist;
        const rawY = Math.sin(p.angle + rotY) * p.dist;

        const screenX = centerX + rawX;
        const screenY = centerY + rawY * Math.sin(rotX);

        ctx.beginPath();
        ctx.arc(screenX, screenY, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
    });

    // 2. Núcleo brillante
    const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 60);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(0.2, 'rgba(255, 215, 0, 0.8)');
    gradient.addColorStop(0.6, 'rgba(255, 105, 180, 0.3)');
    gradient.addColorStop(1, 'transparent');

    ctx.beginPath();
    ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // 3. Corazón
    const currentScale = 1 + pulse * 0.08;

    heart.forEach(p => {
        const screenX = centerX + p.baseX * currentScale;
        const screenY = centerY + p.baseY * currentScale;

        ctx.beginPath();
        ctx.arc(screenX, screenY, p.size * (1 + pulse * 0.3), 0, Math.PI * 2);
        ctx.fillStyle = p.color + (p.alpha * (0.7 + pulse * 0.3)) + ')';
        ctx.fill();
    });

    // Texto EDEL
    const heartCenterY = centerY - 220 * currentScale;
    
    ctx.save();
    ctx.font = `bold ${32 + pulse * 4}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    ctx.shadowColor = '#FF1493';
    ctx.shadowBlur = 20 + pulse * 10;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('EDEL', centerX, heartCenterY);
    ctx.restore();

    // 4. Dibujar Elementos Flotantes (Texto, íconos y Flores)
    floaters.forEach(f => {
        const floatY = Math.sin(pulseTime + f.dist) * 4;

        const currentAngle = f.angle + rotY;
        const rawX = Math.cos(currentAngle) * f.dist;
        const rawY = Math.sin(currentAngle) * f.dist;

        const screenX = centerX + rawX;
        const screenY = centerY + rawY * Math.sin(rotX) + floatY;

        if (f.type === 'text') {
            ctx.font = `bold ${f.size}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = f.color;
            ctx.textAlign = 'center';

            const lines = f.text.split('\n');
            lines.forEach((line, index) => {
                ctx.fillText(line, screenX, screenY + (index * (f.size + 4)));
            });

        } else if (f.type === 'icon') {
            ctx.beginPath();
            ctx.arc(screenX, screenY, f.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#333333';
            ctx.stroke();

            const r = f.radius;
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.arc(screenX, screenY - r * 0.3, r * 0.22, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(screenX, screenY - r * 0.08);
            ctx.lineTo(screenX, screenY + r * 0.35);
            ctx.lineTo(screenX - r * 0.4, screenY + r * 0.1);
            ctx.moveTo(screenX, screenY + r * 0.35);
            ctx.lineTo(screenX + r * 0.4, screenY + r * 0.1);
            ctx.stroke();

            ctx.font = `bold ${Math.floor(f.radius * 0.32)}px sans-serif`;
            ctx.fillStyle = '#111111';
            ctx.textAlign = 'center';
            ctx.fillText(f.text, screenX, screenY + r * 0.65);

        } else if (f.type === 'flower') {
            drawYellowFlower(screenX, screenY, f.radius);

            // Frase bonita debajo de la flor
            ctx.save();
            ctx.font = "bold 12px 'Segoe UI', sans-serif";
            ctx.fillStyle = '#FFF8DC';
            ctx.shadowColor = '#FFD700';
            ctx.shadowBlur = 8;
            ctx.textAlign = 'center';
            ctx.fillText(f.phrase, screenX, screenY + f.radius + 14);
            ctx.restore();
        }
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
