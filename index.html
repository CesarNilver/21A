<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Flores Amarillas - Edel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #0B0813 0%, #030206 100%);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            cursor: grab;
            user-select: none;
        }

        body:active {
            cursor: grabbing;
        }

        #universe {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Indicador visual elegante */
        .hint {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFE082;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            pointer-events: none;
            background: rgba(15, 10, 25, 0.65);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 15px rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        /* Modal Romántico Premium */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 2, 8, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(12px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-card {
            background: linear-gradient(165deg, rgba(35, 20, 10, 0.85) 0%, rgba(12, 6, 18, 0.95) 100%);
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 180, 0, 0.25);
            border-radius: 28px;
            padding: 40px;
            max-width: 460px;
            width: 88%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Resplandor decorativo interno del modal */
        .modal-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .modal-title {
            font-family: 'Georgia', 'Brush Script MT', cursive, serif;
            font-size: 38px;
            color: #FFE082;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 224, 130, 0.5);
            font-weight: normal;
        }

        .modal-text {
            font-size: 15px;
            line-height: 1.7;
            color: #f1e4d8;
            margin-bottom: 16px;
            font-style: italic;
            font-weight: 300;
        }

        .modal-btn {
            background: linear-gradient(135deg, #FFB300, #FF6F00);
            color: #ffffff;
            border: none;
            padding: 12px 36px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 6px 20px rgba(255, 143, 0, 0.4);
            transition: all 0.3s ease;
        }

        .modal-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 10px 25px rgba(255, 179, 0, 0.6);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="universe">
        <canvas id="galaxyCanvas"></canvas>
        <div class="hint">✨ Arrastra para explorar la galaxia 3D de Edel ✨</div>
    </div>

    <!-- Modal emergente -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal-card">
            <h1 class="modal-title">Mi Amor...</h1>
            <p class="modal-text">Eres la coincidencia más hermosa que me pudo pasar.</p>
            <p class="modal-text">Así como estas flores y estrellas iluminan la inmensidad, tu sonrisa ilumina cada uno de mis días.</p>
            <p class="modal-text"><strong>¡Feliz Día de las Flores Amarillas!</strong><br>Te amo infinitamente, Edel.</p>
            <button class="modal-btn" onclick="closeModal()">EXPLORAR GALAXIA</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // --- Controles de Interacción 3D Suaves ---
        let rotX = 0.55;
        let rotY = 0;
        let targetRotX = 0.55;
        let targetRotY = 0;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            targetRotY += deltaX * 0.003;
            targetRotX += deltaY * 0.003;
            targetRotX = Math.max(0.15, Math.min(Math.PI / 2 - 0.05, targetRotX));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => isDragging = false);

        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            targetRotY += deltaX * 0.003;
            targetRotX += deltaY * 0.003;
            targetRotX = Math.max(0.15, Math.min(Math.PI / 2 - 0.05, targetRotX));

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchend', () => isDragging = false);

        // --- Generación de Espirales de Galaxia Reales ---
        const GALAXY_PARTICLES = 7500;
        const ARMS = 3; // 3 brazos espirales bien definidos
        const galaxy = [];

        for (let i = 0; i < GALAXY_PARTICLES; i++) {
            const isNucleus = i < 1200;
            let dist, angle, color, size, speed;

            if (isNucleus) {
                dist = Math.pow(Math.random(), 2) * 80;
                angle = Math.random() * Math.PI * 2;
                
                // Núcleo cálido radiante
                const r = 255;
                const g = Math.floor(220 + Math.random() * 35);
                const b = Math.floor(140 + Math.random() * 100);
                color = `rgba(${r}, ${g}, ${b}, ${0.7 + Math.random() * 0.3})`;
                size = 1.0 + Math.random() * 2.5;
                speed = 0.0015 + Math.random() * 0.001;
            } else {
                // Brazos Espirales Logarítmicos
                const armIndex = i % ARMS;
                const armOffset = (armIndex * 2 * Math.PI) / ARMS;
                
                const distanceFactor = Math.random();
                dist = 60 + Math.pow(distanceFactor, 1.2) * (Math.min(width, height) * 0.55);
                
                // Rotación logarítmica para formar espiral
                const spiralAngle = Math.log(dist / 40) * 2.2;
                angle = spiralAngle + armOffset + (Math.random() - 0.5) * 0.65; // Desviación para naturalidad

                const isGoldYellow = Math.random() < 0.8;
                if (isGoldYellow) {
                    const r = 255;
                    const g = Math.floor(190 + Math.random() * 65);
                    const b = Math.floor(Math.random() * 60);
                    color = `rgba(${r}, ${g}, ${b}, ${0.35 + Math.random() * 0.55})`;
                    size = 0.8 + Math.random() * 2.2;
                } else {
                    // Chispas violetas / celestes de fondo
                    const r = Math.floor(160 + Math.random() * 95);
                    const g = Math.floor(100 + Math.random() * 100);
                    const b = 255;
                    color = `rgba(${r}, ${g}, ${b}, ${0.25 + Math.random() * 0.45})`;
                    size = 0.6 + Math.random() * 1.5;
                }
                speed = 0.0004 + (140 / (dist + 50)) * 0.0004;
            }

            galaxy.push({
                dist: dist,
                angle: angle,
                speed: speed,
                color: color,
                size: size,
                twinkle: Math.random() * Math.PI * 2
            });
        }

        // --- Lista de Palabras ---
        const words = [
            "Mi sol", "Mi amor", "Mi destino", "Mi cielo", "Esperanza", 
            "Libertad", "Felicidad", "Pasión", "Reina", "Mi razón", 
            "Eternidad", "Brillas", "Sueños", "Mi flor", "Contigo", 
            "Mi calma", "Mi universo", "Dulzura", "Ternura", "Mi fiesta"
        ];

        const totalItems = words.length;
        const floatingItems = words.map((word, index) => {
            const armIndex = index % ARMS;
            const armOffset = (armIndex * 2 * Math.PI) / ARMS;
            const dist = 120 + (index / totalItems) * (Math.min(width, height) * 0.38);
            const angle = Math.log(dist / 40) * 2.2 + armOffset;

            return {
                word: word,
                dist: dist,
                angle: angle,
                radius: 16 + Math.random() * 6,
                isHighlight: index % 3 === 0
            };
        });

        // --- Dibujar Girasol Estilizado Radiante ---
        function drawRealisticSunflower(x, y, radius) {
            ctx.save();
            ctx.translate(x, y);

            // Resplandor dorado de la flor
            const glow = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius * 1.6);
            glow.addColorStop(0, 'rgba(255, 215, 0, 0.35)');
            glow.addColorStop(1, 'rgba(255, 140, 0, 0)');
            ctx.beginPath();
            ctx.arc(0, 0, radius * 1.6, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();

            // Capas de pétalos
            const petalLayers = [
                { count: 16, lenRatio: 1.25, widthRatio: 0.3, color: '#D97706' },
                { count: 16, lenRatio: 1.05, widthRatio: 0.28, color: '#FBBF24' },
                { count: 12, lenRatio: 0.85, widthRatio: 0.25, color: '#FEF08A' }
            ];

            petalLayers.forEach((layer, layerIdx) => {
                const offset = (layerIdx * Math.PI) / layer.count;
                for (let i = 0; i < layer.count; i++) {
                    const angle = (i * Math.PI * 2) / layer.count + offset;
                    ctx.save();
                    ctx.rotate(angle);

                    ctx.beginPath();
                    const pLen = radius * layer.lenRatio;
                    const pWidth = radius * layer.widthRatio;

                    ctx.moveTo(0, -radius * 0.25);
                    ctx.bezierCurveTo(-pWidth, -radius * 0.5, -pWidth * 0.8, -pLen, 0, -pLen * 1.1);
                    ctx.bezierCurveTo(pWidth * 0.8, -pLen, pWidth, -radius * 0.5, 0, -radius * 0.25);

                    ctx.fillStyle = layer.color;
                    ctx.fill();
                    ctx.restore();
                }
            });

            // Centro detallado
            const centerRadius = radius * 0.38;
            ctx.beginPath();
            ctx.arc(0, 0, centerRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#2A1205';
            ctx.fill();

            // Semillas en espiral dorada
            const seedCount = 35;
            const goldenAngle = 137.5 * (Math.PI / 180);
            for (let i = 0; i < seedCount; i++) {
                const r = Math.sqrt(i / seedCount) * (centerRadius * 0.82);
                const theta = i * goldenAngle;
                const sX = r * Math.cos(theta);
                const sY = r * Math.sin(theta);

                ctx.beginPath();
                ctx.arc(sX, sY, radius * 0.04, 0, Math.PI * 2);
                ctx.fillStyle = i % 2 === 0 ? '#8B4513' : '#D97706';
                ctx.fill();
            }

            ctx.restore();
        }

        // --- Bucle de Animación ---
        let pulseTime = 0;

        function animate() {
            // Animación suave del cursor / arrastre (Inercia)
            rotX += (targetRotX - rotX) * 0.05;
            rotY += (targetRotY - rotY) * 0.05;

            // Limpieza con sutil fondo estelar profundo
            ctx.fillStyle = '#030206';
            ctx.fillRect(0, 0, width, height);

            pulseTime += 0.025;

            // 1. Dibujar Partículas de la Galaxia
            galaxy.forEach(p => {
                p.angle += p.speed;
                p.twinkle += 0.04;

                const currentAngle = p.angle + rotY;
                const rawX = Math.cos(currentAngle) * p.dist;
                const rawY = Math.sin(currentAngle) * p.dist;

                const screenX = centerX + rawX;
                const screenY = centerY + rawY * Math.sin(rotX);

                const twinkleAlpha = 0.6 + Math.sin(p.twinkle) * 0.4;

                ctx.beginPath();
                ctx.arc(screenX, screenY, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = twinkleAlpha;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            // 2. Núcleo Galáctico Resplandeciente y Multicapa
            const coreRadius = 110;
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreRadius);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.15, 'rgba(255, 230, 150, 0.9)');
            gradient.addColorStop(0.4, 'rgba(255, 160, 20, 0.45)');
            gradient.addColorStop(0.7, 'rgba(255, 100, 0, 0.15)');
            gradient.addColorStop(1, 'transparent');

            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // 3. Dibujar Girasoles y Etiquetas Románticas
            floatingItems.forEach(f => {
                const floatY = Math.sin(pulseTime + f.dist) * 5;

                f.angle += 0.0004; // Rotación sutil con la galaxia
                const currentAngle = f.angle + rotY;
                const rawX = Math.cos(currentAngle) * f.dist;
                const rawY = Math.sin(currentAngle) * f.dist;

                const screenX = centerX + rawX;
                const screenY = centerY + rawY * Math.sin(rotX) + floatY;

                // Dibujar la flor
                drawRealisticSunflower(screenX - 32, screenY, f.radius);

                // Dibujar etiqueta estilizada de Cristal / Neón
                ctx.save();
                ctx.font = f.isHighlight ? "600 14px 'Segoe UI', sans-serif" : "500 12px 'Segoe UI', sans-serif";

                const textWidth = ctx.measureText(f.word).width;
                const paddingX = 14;
                const rectX = screenX;
                const rectY = screenY - 11;
                const rectWidth = textWidth + paddingX * 2;
                const rectHeight = 22;

                // Fondo traslúcido con efecto cristal
                ctx.beginPath();
                ctx.roundRect(rectX, rectY, rectWidth, rectHeight, 11);
                ctx.fillStyle = 'rgba(12, 8, 20, 0.75)';
                ctx.fill();

                // Borde neón dorado
                ctx.strokeStyle = f.isHighlight ? 'rgba(255, 230, 120, 0.9)' : 'rgba(255, 190, 40, 0.6)';
                ctx.lineWidth = f.isHighlight ? 1.5 : 1;
                ctx.shadowColor = 'rgba(255, 200, 0, 0.5)';
                ctx.shadowBlur = f.isHighlight ? 10 : 4;
                ctx.stroke();

                // Texto con ligero resplandor
                ctx.fillStyle = '#FFFFFF';
                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 6;
                ctx.fillText(f.word, rectX + paddingX, rectY + 15);

                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // --- Cerrar Modal ---
        function closeModal() {
            const modal = document.getElementById('cardModal');
            modal.style.opacity = '0';
            setTimeout(() => modal.classList.add('hidden'), 600);
        }
    </script>
</body>
</html>
