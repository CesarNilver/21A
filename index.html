<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Galaxia 3D de Flores Amarillas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
            overflow: hidden;
            perspective: 1200px; /* Habilita el espacio 3D */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #viewport:active {
            cursor: grabbing;
        }

        /* Contenedor espacial que rota en 3D */
        #space-container {
            position: absolute;
            width: 180vw;
            height: 180vh;
            top: 50%;
            left: 50%;
            will-change: transform;
            transform-style: preserve-3d;
            backface-visibility: visible;
        }

        #galaxyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            backface-visibility: visible;
        }

        /* Agujero negro central con resplandor */
        .black-hole-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160px;
            height: 160px;
            margin-top: -80px;
            margin-left: -80px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .accretion-disk {
            position: absolute;
            width: 220%;
            height: 220%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 235, 120, 0.95) 0%, rgba(255, 140, 0, 0.8) 35%, rgba(220, 50, 0, 0.45) 60%, rgba(0,0,0,0) 78%);
            filter: blur(10px);
            animation: rotateDisk 10s linear infinite;
        }

        .black-hole-core {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #000000;
            box-shadow: 0 0 25px 10px #ffffff,
                        0 0 50px 20px #ffcc00,
                        0 0 90px 40px #ff3300,
                        0 0 140px 60px rgba(255, 180, 0, 0.35);
        }

        @keyframes rotateDisk {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Elementos flotantes con billboarding (siempre frente a la pantalla) */
        .floating-item {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
            z-index: 20;
            will-change: transform;
            transform-style: preserve-3d;
            backface-visibility: visible;
        }

        .sunflower-container {
            position: relative;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.9));
        }

        .sunflower-svg {
            width: 100%;
            height: 100%;
        }

        .tag-text {
            background: rgba(10, 8, 5, 0.88);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            border: 1.5px solid #ffcc00;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.6);
            text-shadow: 0 0 8px #ffcc00;
            backdrop-filter: blur(6px);
        }

        .tag-text.highlight {
            font-size: 18px;
            font-weight: 800;
            border: 2px solid #ffee77;
            box-shadow: 0 0 18px rgba(255, 238, 119, 0.85);
        }

        /* Modal romántico */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .modal-card {
            background: linear-gradient(145deg, rgba(30, 15, 10, 0.95), rgba(10, 5, 15, 0.98));
            border: 2px solid #ffaa00;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.5);
            border-radius: 24px;
            padding: 35px;
            max-width: 440px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 42px;
            color: #ffc233;
            margin-bottom: 18px;
        }

        .modal-text {
            font-size: 15px;
            line-height: 1.6;
            color: #ebdcd0;
            margin-bottom: 15px;
            font-style: italic;
        }

        .modal-btn {
            background: linear-gradient(135deg, #ff9900, #b35900);
            color: white;
            border: none;
            padding: 11px 32px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 12px rgba(255, 153, 0, 0.5);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="space-container">
            <canvas id="galaxyCanvas"></canvas>
            <div class="black-hole-container">
                <div class="accretion-disk"></div>
                <div class="black-hole-core"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="cardModal">
        <div class="modal-card">
            <h1 class="modal-title">Mi Amor...</h1>
            <p class="modal-text">Eres la coincidencia más hermosa que me pudo pasar.</p>
            <p class="modal-text">Así como estas flores y estrellas iluminan la inmensidad, tu sonrisa ilumina cada uno de mis días.</p>
            <p class="modal-text"><strong>¡Feliz Día de las Flores Amarillas, Mi Amor!</strong><br>Te amo infinitamente.</p>
            <button class="modal-btn" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const spaceContainer = document.getElementById('space-container');
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = spaceContainer.clientWidth;
            canvas.height = spaceContainer.clientHeight;
        }
        resizeCanvas();

        /* RENDERING DE LA GALAXIA 3D */
        const stars = [];
        const numStars = 2200;
        const arms = 4;

        for (let i = 0; i < numStars; i++) {
            const distance = Math.pow(Math.random(), 2) * (canvas.width * 0.45);
            const armAngle = (Math.floor(Math.random() * arms) * ((Math.PI * 2) / arms));
            const spiralAngle = distance * 0.0018;
            const totalAngle = armAngle + spiralAngle + (Math.random() - 0.5) * 0.6;

            const x = canvas.width / 2 + Math.cos(totalAngle) * distance;
            const y = canvas.height / 2 + Math.sin(totalAngle) * distance;

            const colors = ['#fff1a8', '#ffb74d', '#e1bee7', '#70d6ff', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            stars.push({
                x, y,
                distance,
                angle: totalAngle,
                speed: (0.0002 + (1 / (distance + 80)) * 0.25),
                size: Math.random() * 2.2 + 0.5,
                color,
                alpha: Math.random() * 0.85 + 0.15
            });
        }

        function drawGalaxy() {
            ctx.fillStyle = 'rgba(1, 1, 3, 0.22)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.globalCompositeOperation = 'screen';
            const nebula = ctx.createRadialGradient(centerX, centerY, 80, centerX, centerY, canvas.width * 0.46);
            nebula.addColorStop(0, 'rgba(255, 170, 30, 0.3)');
            nebula.addColorStop(0.35, 'rgba(170, 40, 240, 0.18)');
            nebula.addColorStop(0.65, 'rgba(20, 70, 190, 0.1)');
            nebula.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.angle += star.speed;
                const currentX = centerX + Math.cos(star.angle) * star.distance;
                const currentY = centerY + Math.sin(star.angle) * star.distance;

                ctx.fillStyle = star.color;
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(currentX, currentY, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;

            requestAnimationFrame(drawGalaxy);
        }
        drawGalaxy();

        /* DIBUJO DEL GIRASOL CON HOJAS */
        function getSunflowerSVG() {
            return `
            <div class="sunflower-container">
                <svg class="sunflower-svg" viewBox="0 0 100 100">
                    <g fill="#2e7d32">
                        <path d="M 50 50 Q 10 20 5 45 Q 25 65 50 50 Z" />
                        <path d="M 50 50 Q 90 20 95 45 Q 75 65 50 50 Z" />
                        <path d="M 50 50 Q 10 80 20 95 Q 55 75 50 50 Z" />
                        <path d="M 50 50 Q 90 80 80 95 Q 45 75 50 50 Z" />
                    </g>
                    <g fill="#ffcc00">
                        <ellipse cx="50" cy="10" rx="6" ry="18"/>
                        <ellipse cx="50" cy="90" rx="6" ry="18"/>
                        <ellipse cx="10" cy="50" rx="18" ry="6"/>
                        <ellipse cx="90" cy="50" rx="18" ry="6"/>
                        <ellipse cx="21" cy="21" rx="6" ry="18" transform="rotate(-45 21 21)"/>
                        <ellipse cx="79" cy="79" rx="6" ry="18" transform="rotate(-45 79 79)"/>
                        <ellipse cx="21" cy="79" rx="6" ry="18" transform="rotate(45 21 79)"/>
                        <ellipse cx="79" cy="21" rx="6" ry="18" transform="rotate(45 79 21)"/>
                    </g>
                    <circle cx="50" cy="50" r="18" fill="#3a1e05"/>
                    <circle cx="50" cy="50" r="14" fill="#200e02"/>
                </svg>
            </div>`;
        }

        const words = [
            "Mi sol", "Mi amor", "Mi destino", "Mi cielo", "Esperanza", 
            "Libertad", "Felicidad", "Pasión", "Reina", "Mi razón", 
            "Eternidad", "Brillas", "Sueños", "Mi flor", "Contigo", 
            "Mi calma", "Mi universo", "Dulzura", "Ternura", "Mi fiesta"
        ];

        /* ELEMENTOS ALREDEDOR DE LA GALAXIA */
        const totalItems = 42;
        const orbitingItems = [];
        const minRadius = 200;
        const maxRadius = spaceContainer.clientWidth * 0.42;

        for (let i = 0; i < totalItems; i++) {
            const item = document.createElement('div');
            item.className = 'floating-item';

            const word = words[Math.floor(Math.random() * words.length)];
            const isHighlight = Math.random() < 0.25;

            item.innerHTML = `
                ${getSunflowerSVG()}
                <span class="tag-text ${isHighlight ? 'highlight' : ''}">${word}</span>
            `;

            spaceContainer.appendChild(item);

            const radius = minRadius + Math.random() * (maxRadius - minRadius);
            const initialAngle = Math.random() * Math.PI * 2;
            const direction = Math.random() < 0.85 ? 1 : -1;
            const speed = (0.0003 + (1 / radius) * 0.12) * direction;
            const scale = 0.75 + Math.random() * 0.45;

            orbitingItems.push({
                element: item,
                radius: radius,
                angle: initialAngle,
                speed: speed,
                scale: scale
            });
        }

        /* NAVEGACIÓN Y ROTACIÓN 3D CON BILLBOARDING DE FRASES Y GIRASOLES */
        let isDragging = false;
        let startX = 0, startY = 0;

        let rotX = 60; // Inclinación inicial elegante del plano galáctico
        let rotY = 0;
        let targetRotX = 60;
        let targetRotY = 0;

        let scale = 1;
        let targetScale = 1;
        let initialPinchDist = null;

        function updatePhysics() {
            rotX += (targetRotX - rotX) * 0.08;
            rotY += (targetRotY - rotY) * 0.08;
            scale += (targetScale - scale) * 0.08;

            // Rota la galaxia en 3D
            spaceContainer.style.transform = `translate(-50%, -50%) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${scale})`;

            const centerX = spaceContainer.clientWidth / 2;
            const centerY = spaceContainer.clientHeight / 2;

            // Las frases y los girasoles orbitan cancelando la rotación para mantenerse parados frente a ti
            orbitingItems.forEach(item => {
                item.angle += item.speed;

                const x = centerX + Math.cos(item.angle) * item.radius;
                const y = centerY + Math.sin(item.angle) * item.radius;

                item.element.style.transform = `translate3d(${x}px, ${y}px, 0px) translate(-50%, -50%) rotateY(${-rotY}deg) rotateX(${-rotX}deg) scale(${item.scale})`;
            });

            requestAnimationFrame(updatePhysics);
        }

        spaceContainer.style.left = '50%';
        spaceContainer.style.top = '50%';
        updatePhysics();

        function getPinchDistance(e) {
            return Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }

        /* EVENTOS TÁCTILES Y DE MOUSE */
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDist = getPinchDistance(e);
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                const deltaX = e.touches[0].clientX - startX;
                const deltaY = e.touches[0].clientY - startY;

                targetRotY += deltaX * 0.35;
                targetRotX -= deltaY * 0.35;

                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else if (e.touches.length === 2 && initialPinchDist) {
                const newDist = getPinchDistance(e);
                const factor = newDist / initialPinchDist;
                targetScale = Math.min(Math.max(scale * factor, 0.4), 2.5);
                initialPinchDist = newDist;
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialPinchDist = null;
            if (e.touches.length === 0) isDragging = false;
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomAmount = e.deltaY * -0.001;
            targetScale = Math.min(Math.max(targetScale + zoomAmount, 0.4), 2.5);
        }, { passive: false });

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            targetRotY += deltaX * 0.35;
            targetRotX -= deltaY * 0.35;

            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        function closeModal() {
            document.getElementById('cardModal').classList.add('hidden');
        }
    </script>
</body>
</html>
